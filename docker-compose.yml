services:
  scalvid-frontend:
    build: ./frontend
    container_name: scalvid-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    depends_on:
      - scalvid-backend

  scalvid-backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "${HTTP_PORT}:8000"
    environment:
      - GO_ENV=${GO_ENV}
      - DB_HOST=scalvid-db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    restart: unless-stopped
    container_name: scalvid-backend
    # Must exceed the server's 15s graceful shutdown timeout (rest/server.go),
    # otherwise Docker SIGKILLs it before in-flight requests finish
    stop_grace_period: 20s
    depends_on:
      scalvid-db:
        condition: service_healthy

  scalvid-db:
    image: postgres:18
    container_name: scalvid-db
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    restart: unless-stopped
    volumes:
      - scalvid_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  scalvid_postgres_data:
